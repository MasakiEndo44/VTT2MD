name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        python -m pyinstaller src/vtt2md/main.py --onefile --windowed --name VTT2MD --clean
        # If main.spec exists and works, we could use: pyinstaller main.spec
        # checking if dist/VTT2MD.exe exists
        if (Test-Path dist/VTT2MD.exe) { Write-Host "Build Successful" } else { Write-Error "Build Failed"; exit 1 }

    - name: Build Installer (Inno Setup)
      uses: Minionguyjosh/setup-inno-setup@v1.4.1
      with:
        version: "6.2.2"
    
    - name: Compile Installer
      run: iscc installer.iss

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/VTT2MD.exe
          installer/VTT2MD_Setup.exe
        generate_release_notes: true
